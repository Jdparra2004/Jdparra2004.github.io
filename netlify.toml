# ==============================================================================
# Configuración Oficial de Despliegue en Netlify (Next.js Static Export)
# Portafolio Profesional de Juan David Parra Cantor
# ==============================================================================

[build]
  command = "npm run build"
  publish = "out"

# ------------------------------------------------------------------------------
# 1. Cabeceras de Seguridad y Políticas HTTP
# ------------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Inmutabilidad para chunks estáticos de Next.js
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fuentes locales y recursos inmutables
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Imágenes, favicons y documentos PDF
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
